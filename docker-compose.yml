services:
  orun-notebook-db:
    image: surrealdb/surrealdb:v2
    # Credenciais default root:root pra setup local zero-config. Antes de
    # expor essa instância pra rede, setar SURREAL_USER / SURREAL_PASSWORD
    # via ISecretStore (injetados no ambiente pelo Orun Desktop ao subir
    # este serviço, não hardcoded aqui).
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root  # necessário pra bind mounts no Linux
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  orun-notebook:
    # build local do fork, não a imagem upstream lfnovo/open_notebook
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8502:8502"  # Web UI
      - "5055:5055"  # REST API
    environment:
      # Chave de encriptação das API keys salvas no banco. NÃO hardcoded:
      # o Orun Desktop injeta isso no ambiente do container a partir do
      # ISecretStore no momento de subir o serviço (docker compose up
      # via child_process com env herdado, não um valor fixo no arquivo).
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${ORUN_NOTEBOOK_ENCRYPTION_KEY:?defina via ISecretStore antes de subir}

      - SURREAL_URL=ws://orun-notebook-db:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=orun_notebook
      - SURREAL_DATABASE=orun_notebook

      # --- Auth: @orun/identity (ver api/auth_orun.py) ---
      # SUPABASE_JWT_ALG: "HS256" (JWT Secret legado) ou "JWKS" (assinatura
      # assimétrica, recomendado). Ambos vindos do ISecretStore.
      - SUPABASE_JWT_ALG=${SUPABASE_JWT_ALG:-HS256}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      # Gate opcional por plano — vazio = qualquer usuário autenticado passa
      - REQUIRE_LICENSE_FEATURE=${REQUIRE_LICENSE_FEATURE:-}
      - ORUN_LICENSE_PUBLIC_KEY_PATH=${ORUN_LICENSE_PUBLIC_KEY_PATH:-}

      # --- AI provider: @orun/ai-router exposto como endpoint OpenAI-compatible ---
      # Registrado como credential via POST /credentials na primeira subida
      # (ver Fase 3 do plano) — não precisa entrar aqui como env fixo, mas
      # o host fica documentado pra referência/debug.
      - ORUN_AI_ROUTER_URL=${ORUN_AI_ROUTER_URL:-http://host.docker.internal:PORT/v1}

      # OPCIONAL: runtimes pesados de extração (ver docs originais do
      # Open Notebook, docs/5-CONFIGURATION/environment-reference.md)
      # - OPEN_NOTEBOOK_ENABLE_DOCLING=true
      # - OPEN_NOTEBOOK_ENABLE_CRAWL4AI=true
      # - OPEN_NOTEBOOK_WORKER_MAX_TASKS=1
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      - orun-notebook-db
    restart: always
